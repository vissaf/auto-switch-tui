[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "auto-switch"
version = "0.1.0"
description = "Find, rank, and tailor jobs to your profile (TUI & evidence-backed resume builder)"
readme = "README.md"
requires-python = ">=3.10, <3.13"
dependencies = [
    "textual==8.2.8",
    "rich==15.0.0",
    "httpx==0.28.1",
    "beautifulsoup4==4.15.0",
    "lxml==6.1.2",
    "python-jobspy==1.1.82",
    "fastembed==0.8.0",
    "playwright==1.62.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.8.0",
]

[project.scripts]
auto-switch = "auto_switch.main:main"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
